<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Acme Store – SideReplay demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, sans-serif; color: #1d1f23; background: #f4f6fb; }
    header { background: #fff; border-bottom: 1px solid #e3e6ee; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header strong { font-size: 18px; color: #2350d8; }
    header span { color: #6b7079; font-size: 13px; }
    main { max-width: 640px; margin: 32px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #e3e6ee; border-radius: 12px; padding: 24px; box-shadow: 0 4px 16px rgb(20 30 60 / 0.06); }
    h1 { margin: 0 0 16px; font-size: 22px; }
    label { display: block; margin-bottom: 14px; font-weight: 500; }
    input { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid #cfd4df; border-radius: 8px; font: inherit; }
    button { background: #2350d8; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    button.small { background: #fff; color: #b42318; border: 1px solid #f0c7c3; padding: 4px 10px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    td, th { text-align: left; padding: 10px 6px; border-bottom: 1px solid #eef0f5; }
    .hint { margin-top: 16px; color: #6b7079; font-size: 13px; }
  </style>
</head>
<body>
  <header><strong>Acme Store</strong><span>A demo page for trying SideReplay. Nothing here is real.</span></header>
  <main>
    <form id="sign-in-form" class="card">
      <h1>Sign in</h1>
      <label>Email <input id="email" type="email" placeholder="you@example.com" autocomplete="off"></label>
      <label>Password <input id="password" type="password" autocomplete="off"></label>
      <button id="sign-in" data-test="sign-in" type="submit">Sign in</button>
      <p class="hint">Any email and password work.</p>
    </form>

    <section id="account" class="card" hidden>
      <h1 id="welcome"></h1>
      <table id="orders">
        <tr><th>Order</th><th>Item</th><th>Status</th><th></th></tr>
        <tr><td>#1001</td><td>Wireless keyboard</td><td id="status-1001">Delivered</td><td></td></tr>
        <tr><td>#1002</td><td>USB-C hub</td><td id="status-1002">Processing</td><td><button id="cancel-1002" class="small" type="button">Cancel</button></td></tr>
      </table>
    </section>
  </main>
  <script>
    document.getElementById('sign-in-form').addEventListener('submit', (event) => {
      event.preventDefault();
      document.getElementById('welcome').textContent = 'Welcome back, ' + (document.getElementById('email').value || 'guest');
      event.target.hidden = true;
      document.getElementById('account').hidden = false;
    });
    document.getElementById('cancel-1002').addEventListener('click', (event) => {
      if (!confirm('Cancel order #1002?')) return;
      document.getElementById('status-1002').textContent = 'Cancelled';
      event.target.remove();
    });
  </script>
</body>
</html>
